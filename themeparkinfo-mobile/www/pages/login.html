<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://themeparkinfo-api.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com http://127.0.0.1:9099; frame-src https://themeparkinfo-ba1e8.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Welcome · Adventure Scout</title>
  <link rel="stylesheet" href="../assets/css/login.css">
  <script src="../assets/js/auth.bundle.js" defer></script>
  <script src="../assets/js/login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <header class="login-brand"><span class="brand-compass" aria-hidden="true">✦</span> Adventure Scout</header>
    <section class="login-hero" aria-labelledby="welcome-title">
      <div class="park-mark" aria-hidden="true"><span class="wheel"></span><span class="wheel-support"></span></div>
      <p class="eyebrow">More rides. Less waiting.</p>
      <h1 id="welcome-title">Your next great<br>park day starts here.</h1>
      <p class="hero-description">Save your favorite rides.<br>Find the right time to ride.</p>
    </section>
    <section class="login-panel" aria-labelledby="login-title">
      <h2 id="login-title">Let’s get you in</h2>
      <p class="login-subtitle" id="login-subtitle">Sign in or create your free account.</p>
      <button class="login-button google-button" type="button" id="google-signin"><span class="google-letter" aria-hidden="true">G</span>Continue with Google</button>
      <div class="login-divider"><span></span><span>or</span><span></span></div>
      <button class="login-button primary-button" type="button" id="email-signin"><span aria-hidden="true">✉</span>Continue with email</button>
      <form id="email-form" hidden>
        <label for="login-email">Email address</label>
        <input id="login-email" type="email" autocomplete="username" placeholder="you@example.com" required>
        <div id="password-fields">
          <label for="login-password">Password</label>
          <div class="password-field"><input id="login-password" type="password" autocomplete="current-password" placeholder="Your password" required><button id="show-password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div>
          <button class="text-button forgot-button" type="button" id="forgot-password">Forgot password?</button>
        </div>
        <button class="login-button primary-button" type="submit" id="email-submit">Sign in</button>
        <p class="account-switch"><span id="account-prompt">New to Adventure Scout?</span> <button class="text-button" type="button" id="switch-mode">Create account</button></p>
        <button class="text-button back-button" id="back-to-options" type="button">Back to sign-in options</button>
      </form>
      <p class="login-message" id="login-message" role="status" aria-live="polite" hidden></p>
      <div id="verification-actions" hidden><button class="text-button" id="resend-verification" type="button">Resend verification email</button><button class="login-button primary-button" id="continue-verified" type="button">I’ve verified my email</button></div>
      <button class="login-button google-button" id="test-signin" type="button" hidden>Continue as test user</button>
      <p class="preview-note" id="test-note" hidden>Local test mode · No real account needed.</p>
    </section>
    <footer>Your park plans, in one place.</footer>
  </main>
</body>
</html>
